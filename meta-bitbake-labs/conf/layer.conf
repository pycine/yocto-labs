# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bitbake-labs"
BBFILE_PATTERN_meta-bitbake-labs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bitbake-labs = "6"

LAYERDEPENDS_meta-bitbake-labs = "core"
LAYERSERIES_COMPAT_meta-bitbake-labs = "wrynose"
